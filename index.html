<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글자 수 세기</title>
  <style>
    /* 외부 라이브러리 없이, 한 페이지로 동작하는 글자 수 세기 도구입니다. */
    :root {
      --green: #00c85a;
      --green-dark: #00a64a;
      --mint: #d6f5e3;
      --teal: #12b5cb;
      --purple: #7c5cff;
      --red: #ff3b3b;
      --text: #1b1d22;
      --sub: #8a90a0;
    }
    * {
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 16px 56px;
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      color: var(--text);
      /* 은은하게 색이 번지는 배경입니다. */
      background:
        radial-gradient(circle at 12% 8%, rgba(0, 200, 90, 0.22), transparent 42%),
        radial-gradient(circle at 92% 18%, rgba(124, 92, 255, 0.20), transparent 40%),
        radial-gradient(circle at 70% 96%, rgba(18, 181, 203, 0.20), transparent 45%),
        #f0f1f7;
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 18px 6px;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -1px;
      /* 제목에 초록에서 청록, 보라로 이어지는 그라데이션을 줍니다. */
      background: linear-gradient(100deg, var(--green) 0%, var(--teal) 55%, var(--purple) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .card {
      margin-bottom: 14px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(40, 50, 90, 0.08);
    }
    textarea {
      display: block;
      width: 100%;
      min-height: 220px;
      padding: 22px 24px;
      font-family: inherit;
      font-size: 17px;
      line-height: 1.7;
      color: var(--text);
      background: transparent;
      border: 2px solid transparent;
      border-radius: 22px;
      outline: 0;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 5px rgba(0, 200, 90, 0.15);
    }
    textarea::placeholder {
      color: #b3b8c4;
    }

    /* 한 줄짜리 항목(제한 글자 수, 결과)의 공통 모양입니다. */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 24px;
    }
    .row + .row {
      border-top: 1px solid #eef0f5;
    }
    .label {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 600;
    }
    /* 항목 앞의 색 점입니다. */
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
    .dot.green {
      background: linear-gradient(135deg, #5df59b, var(--green));
      box-shadow: 0 0 0 4px rgba(0, 200, 90, 0.15);
    }
    .dot.purple {
      background: linear-gradient(135deg, #b1a0ff, var(--purple));
      box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.15);
    }
    .dot.orange {
      background: linear-gradient(135deg, #ffd166, #ff8a3d);
      box-shadow: 0 0 0 4px rgba(255, 138, 61, 0.15);
    }

    #limit {
      width: 130px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 700;
      text-align: right;
      color: var(--text);
      background: #f3f4f9;
      border: 2px solid transparent;
      border-radius: 12px;
      outline: 0;
      transition: border-color 0.2s, background 0.2s;
    }
    #limit:focus {
      background: #fff;
      border-color: var(--green);
    }
    #limit::placeholder {
      font-size: 14px;
      font-weight: 500;
      color: #b3b8c4;
    }

    .value {
      text-align: right;
      font-size: 17px;
      color: var(--sub);
    }
    .num {
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
    }
    #count {
      color: var(--green);
    }
    #countNoSpace {
      color: var(--purple);
    }
    /* 제한을 넘으면 숫자를 빨간색으로 바꿉니다. */
    #count.over,
    #countNoSpace.over {
      color: var(--red);
    }
    .byte {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #a8aebb;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }
    .buttons button {
      flex: 1;
      padding: 18px 12px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      border: 0;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s, filter 0.2s;
    }
    .buttons button:hover {
      transform: translateY(-2px);
    }
    .buttons button:active {
      transform: translateY(0);
    }
    #count-btn {
      color: #fff;
      background: linear-gradient(120deg, var(--green) 0%, var(--teal) 100%);
      box-shadow: 0 10px 22px rgba(0, 200, 90, 0.35);
    }
    #count-btn:hover {
      filter: brightness(1.05);
    }
    #clear {
      color: var(--green-dark);
      background: var(--mint);
    }
    #clear:hover {
      filter: brightness(0.97);
    }
    .hint {
      margin: 18px 6px 0;
      font-size: 13px;
      color: var(--sub);
    }
    @media (max-width: 420px) {
      h1 {
        font-size: 32px;
      }
      .row {
        padding: 16px 18px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>글자 수 세기</h1>

    <!-- 입력 칸: 여기에 글을 적습니다. -->
    <div class="card">
      <textarea id="input" placeholder="글자 수를 셀 내용을 입력해 주세요."></textarea>
    </div>

    <!-- 제한 글자 수: 비워 두면 제한 없이 셉니다. -->
    <div class="card">
      <div class="row">
        <label class="label" for="limit"><span class="dot orange"></span>제한 글자 수</label>
        <input type="number" id="limit" min="0" placeholder="제한 없음" />
      </div>
    </div>

    <!-- 결과: 입력이 바뀔 때마다 실시간으로 갱신됩니다. -->
    <div class="card">
      <div class="row">
        <span class="label"><span class="dot green"></span>공백 포함</span>
        <span class="value">
          <span class="num" id="count">0</span>자
          <span class="byte"><span id="byte">0</span>byte</span>
        </span>
      </div>
      <div class="row">
        <span class="label"><span class="dot purple"></span>공백 제외</span>
        <span class="value">
          <span class="num" id="countNoSpace">0</span>자
          <span class="byte"><span id="byteNoSpace">0</span>byte</span>
        </span>
      </div>
    </div>

    <div class="buttons">
      <button type="button" id="count-btn">글자 수 세기</button>
      <!-- 전체 지우기: 입력 칸을 비웁니다. -->
      <button type="button" id="clear">전체 지우기</button>
    </div>

    <p class="hint">입력 칸의 내용이 바뀔 때마다 자동으로 다시 셉니다.</p>
  </div>

  <script>
    // 입력 칸과 결과 표시 영역을 가져옵니다.
    var input = document.getElementById("input");
    var countView = document.getElementById("count");
    var countNoSpaceView = document.getElementById("countNoSpace");
    var byteView = document.getElementById("byte");
    var byteNoSpaceView = document.getElementById("byteNoSpace");
    var limitInput = document.getElementById("limit");
    var countButton = document.getElementById("count-btn");
    var clearButton = document.getElementById("clear");

    // UTF-8 기준 바이트 수입니다. 한글은 3byte, 영문·숫자·공백은 1byte로 셉니다.
    var encoder = new TextEncoder();
    function byteLength(text) {
      return encoder.encode(text).length;
    }

    // 글자 수를 세어 화면에 보여 주는 함수입니다.
    // 빈 입력이면 length가 0이므로 자연스럽게 0이 표시됩니다.
    function updateCount() {
      var text = input.value;
      // 띄어쓰기, 줄바꿈, 탭 같은 공백 문자를 모두 뺀 글입니다.
      var noSpaceText = text.replace(/\s/g, "");

      countView.textContent = text.length.toLocaleString();
      countNoSpaceView.textContent = noSpaceText.length.toLocaleString();
      byteView.textContent = byteLength(text).toLocaleString();
      byteNoSpaceView.textContent = byteLength(noSpaceText).toLocaleString();

      // 제한 칸이 비어 있거나 숫자가 아니면 제한이 없는 것으로 봅니다.
      var limit = limitInput.value === "" ? NaN : Number(limitInput.value);
      // 제한을 넘은 숫자만 빨간색으로 보여 줍니다.
      countView.classList.toggle("over", text.length > limit);
      countNoSpaceView.classList.toggle("over", noSpaceText.length > limit);
    }

    // 입력이 바뀔 때마다 실시간으로 다시 셉니다.
    input.addEventListener("input", updateCount);
    // 제한 글자 수를 바꿨을 때도 바로 색을 다시 맞춥니다.
    limitInput.addEventListener("input", updateCount);

    // 글자 수 세기 버튼을 누르면 그 자리에서 한 번 더 셉니다.
    countButton.addEventListener("click", updateCount);

    // 전체 지우기를 누르면 입력 칸을 비우고 글자 수를 다시 셉니다.
    clearButton.addEventListener("click", function () {
      input.value = "";
      updateCount();
      input.focus();
    });

    // 처음 화면을 열었을 때도 한 번 맞춰 둡니다.
    updateCount();
  </script>
</body>
</html>

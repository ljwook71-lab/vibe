<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글자수세기</title>
  <style>
    /* 외부 라이브러리 없이, 한 페이지로 동작하는 글자 수 세기 도구입니다. */
    body {
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      max-width: 640px;
      margin: 48px auto;
      padding: 0 16px;
      color: #1a1a1a;
      background: #f5f6f8;
    }
    /* 네이버 검색 결과의 도구 상자처럼 흰 카드 하나에 모두 담습니다. */
    .card {
      padding: 20px;
      background: #fff;
      border: 1px solid #e3e5e8;
      border-radius: 12px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 18px;
    }
    /* 입력 칸과 결과 줄을 한 상자로 묶습니다. */
    .box {
      border: 1px solid #d3d5d7;
      border-radius: 8px;
      overflow: hidden;
    }
    .box:focus-within {
      border-color: #03c75a;
    }
    textarea {
      display: block;
      width: 100%;
      min-height: 200px;
      padding: 14px;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.6;
      border: 0;
      outline: 0;
      box-sizing: border-box;
      resize: vertical;
    }
    .count {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 0;
      margin: 0;
      padding: 12px 14px;
      font-size: 14px;
      color: #404040;
      background: #f7f8f9;
      border-top: 1px solid #e3e5e8;
    }
    .item + .item {
      margin-left: 14px;
      padding-left: 14px;
      border-left: 1px solid #d3d5d7;
    }
    .num {
      font-weight: 700;
      color: #03c75a;
    }
    .byte {
      color: #8f8f8f;
    }
    .num.over {
      color: #d32f2f;
    }
    .tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 14px;
    }
    .limit {
      margin: 0;
      font-size: 14px;
    }
    .limit input {
      width: 110px;
      margin-left: 8px;
      padding: 7px 8px;
      font-size: 14px;
      border: 1px solid #d3d5d7;
      border-radius: 6px;
      box-sizing: border-box;
    }
    #clear {
      padding: 8px 16px;
      font-size: 14px;
      color: #404040;
      background: #fff;
      border: 1px solid #d3d5d7;
      border-radius: 6px;
      cursor: pointer;
    }
    #clear:hover {
      background: #f7f8f9;
    }
    .hint {
      margin: 12px 0 0;
      font-size: 13px;
      color: #8f8f8f;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>글자수세기</h1>

    <div class="box">
      <!-- 입력 칸: 여기에 글을 적습니다. -->
      <textarea id="input" placeholder="글자 수를 셀 내용을 입력해 주세요."></textarea>

      <!-- 결과: 입력이 바뀔 때마다 실시간으로 갱신됩니다. -->
      <p class="count">
        <span class="item">공백포함 총 <span class="num" id="count">0</span>자
          <span class="byte">(<span id="byte">0</span>byte)</span></span>
        <span class="item">공백제외 총 <span class="num" id="countNoSpace">0</span>자
          <span class="byte">(<span id="byteNoSpace">0</span>byte)</span></span>
      </p>
    </div>

    <div class="tools">
      <!-- 제한 글자 수: 비워 두면 제한 없이 셉니다. -->
      <p class="limit">
        <label for="limit">제한 글자 수</label>
        <input type="number" id="limit" min="0" placeholder="제한 없음" />
      </p>

      <!-- 전체 지우기: 입력 칸을 비웁니다. -->
      <button type="button" id="clear">전체 지우기</button>
    </div>

    <p class="hint">입력 칸의 내용이 바뀔 때마다 자동으로 다시 셉니다.</p>
  </div>

  <script>
    // 입력 칸과 결과 표시 영역을 가져옵니다.
    var input = document.getElementById("input");
    var countView = document.getElementById("count");
    var countNoSpaceView = document.getElementById("countNoSpace");
    var byteView = document.getElementById("byte");
    var byteNoSpaceView = document.getElementById("byteNoSpace");
    var limitInput = document.getElementById("limit");
    var clearButton = document.getElementById("clear");

    // UTF-8 기준 바이트 수입니다. 한글은 3byte, 영문·숫자·공백은 1byte로 셉니다.
    var encoder = new TextEncoder();
    function byteLength(text) {
      return encoder.encode(text).length;
    }

    // 글자 수를 세어 화면에 보여 주는 함수입니다.
    // 빈 입력이면 length가 0이므로 자연스럽게 0이 표시됩니다.
    function updateCount() {
      var text = input.value;
      // 띄어쓰기, 줄바꿈, 탭 같은 공백 문자를 모두 뺀 글입니다.
      var noSpaceText = text.replace(/\s/g, "");

      countView.textContent = text.length.toLocaleString();
      countNoSpaceView.textContent = noSpaceText.length.toLocaleString();
      byteView.textContent = byteLength(text).toLocaleString();
      byteNoSpaceView.textContent = byteLength(noSpaceText).toLocaleString();

      // 제한 칸이 비어 있거나 숫자가 아니면 제한이 없는 것으로 봅니다.
      var limit = limitInput.value === "" ? NaN : Number(limitInput.value);
      // 제한을 넘은 숫자만 빨간색으로 보여 줍니다.
      countView.classList.toggle("over", text.length > limit);
      countNoSpaceView.classList.toggle("over", noSpaceText.length > limit);
    }

    // 입력이 바뀔 때마다 실시간으로 다시 셉니다.
    input.addEventListener("input", updateCount);
    // 제한 글자 수를 바꿨을 때도 바로 색을 다시 맞춥니다.
    limitInput.addEventListener("input", updateCount);

    // 전체 지우기를 누르면 입력 칸을 비우고 글자 수를 다시 셉니다.
    clearButton.addEventListener("click", function () {
      input.value = "";
      updateCount();
      input.focus();
    });

    // 처음 화면을 열었을 때도 한 번 맞춰 둡니다.
    updateCount();
  </script>
</body>
</html>
